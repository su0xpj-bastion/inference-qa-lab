[pytest]
# A realistic serving-team GPU suite wired to gpu-testkit. In CI it runs under the fake backend
# (GPU_TESTKIT_FAKE_SPEC=h100x8); on a GPU runner the same file runs with --gpu-backend=nvml.
testpaths = .
gpu_reruns = 1
gpu_quarantine = quarantine.toml
gpu_diagnostics_dir = ../../reports/diagnostics
gpu_infra_exceptions =
    gpu_testkit.classify.InfraError
    gpu_testkit.pool.PoolTimeout
    simkernels.CommunicatorLost
