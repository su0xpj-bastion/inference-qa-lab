# One NetworkAttachmentDefinition per RoCE rail. Each pulls a VF from its own SR-IOV
# device-plugin pool (nvidia.com/rail<N>_vf, configured by the NVIDIA Network Operator's
# SriovNetworkNodePolicy), so pod net<N+1> always sits on physical rail N. Rails are separate
# L3 subnets (10.10<N>.0.0/16) in a rail-optimized fabric; whereabouts hands out pod IPs.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: roce-rail0
  namespace: fabric-validation
  annotations:
    k8s.v1.cni.cncf.io/resourceName: nvidia.com/rail0_vf
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "roce-rail0",
      "type": "sriov",
      "vlan": 0,
      "spoofchk": "off",
      "trust": "on",
      "ipam": {
        "type": "whereabouts",
        "range": "10.100.0.0/16"
      }
    }
---
