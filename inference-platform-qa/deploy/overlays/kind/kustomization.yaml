apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  - target: {kind: Deployment, name: inference}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: MOCKSERVE_ALLOW_FAULTS, value: "1"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: MOCKSERVE_LOG, value: "1"}
