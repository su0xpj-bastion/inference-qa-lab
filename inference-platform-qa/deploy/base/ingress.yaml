apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inference
  annotations:
    # SSE: stream bytes as they arrive. Buffering turns TTFT into total latency.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # Long generations: default 60s read timeout cuts long streams.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # Retry only when the request never reached a pod; never replay a POST that did.
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  rules:
    - host: inference.local
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend: {service: {name: inference, port: {name: http}}}
