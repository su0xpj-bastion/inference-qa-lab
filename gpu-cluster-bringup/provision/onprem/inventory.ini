# On-prem HGX H100 + MI300X racks. One group per rack so the acceptance play
# can be run, and its results correlated, rack by rack.
# bmc_ip is the BMC (Redfish) address used for power control and PXE boot.

[rack_r01]
gpu-r01-n[01:08] node_type=hgx-h100-ndr

[rack_r02]
gpu-r02-n[01:08] node_type=hgx-h100-ndr

[rack_r03]
gpu-r03-n[01:08] node_type=hgx-h100-ndr

[rack_r04]
gpu-r04-n[01:08] node_type=hgx-h100-ndr

[rack_r05]
amd-r05-n[01:04] node_type=mi300x-ndr

[nvidia:children]
rack_r01
rack_r02
rack_r03
rack_r04

[amd:children]
rack_r05

[gpu:children]
nvidia
amd

[gpu:vars]
ansible_user=ops
