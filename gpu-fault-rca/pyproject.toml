[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-fault-rca"
version = "0.1.0"
description = "Fault injection + cross-layer root-cause analysis for a simulated multi-node GPU inference deployment"
requires-python = ">=3.11"

[project.scripts]
rca = "rca.cli:main"
chaos = "faultsim.cli:main"

[tool.setuptools]
packages = ["faultsim", "rca"]
