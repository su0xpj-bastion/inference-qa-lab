name: inference-endpoint-scenarios
on:
  push:
    paths: ["inference-endpoint-scenarios/**", ".github/workflows/inference-endpoint-scenarios.yml"]
  pull_request:
    paths: ["inference-endpoint-scenarios/**", ".github/workflows/inference-endpoint-scenarios.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

defaults:
  run:
    working-directory: inference-endpoint-scenarios
jobs:
  mock:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - name: harness on healthy mock (must pass)
        run: python -m ies run --target mock --out reports/healthy
      - name: harness with injected faults (must fail)
        run: |
          if python -m ies run --target mock --faults slow_decode,crosstalk,usage_drift --out reports/faults; then
            echo "faults were not detected"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-reports
          path: inference-endpoint-scenarios/reports/

  sdk-matrix:
    # Client-SDK qualification: the same suite against the oldest supported SDK, two
    # pinned releases, and whatever PyPI has today (canary: reports, doesn't block).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["1.59.0", "1.67.0", "1.91.0", "latest"]
    continue-on-error: ${{ matrix.sdk == 'latest' }}
    name: sdk ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: install cerebras_cloud_sdk ${{ matrix.sdk }}
        run: |
          if [ "${{ matrix.sdk }}" = "latest" ]; then pip install -U cerebras_cloud_sdk; else pip install "cerebras_cloud_sdk==${{ matrix.sdk }}"; fi
          python -c "import cerebras.cloud.sdk as s; print('cerebras_cloud_sdk', s.__version__)" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: python -m pytest

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: harness against api.cerebras.ai
        run: |
          if [ -z "$CEREBRAS_API_KEY" ]; then
            echo "CEREBRAS_API_KEY secret not set; skipping live run" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          python -m ies run --target live -w all,soak --out reports/live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-report
          path: inference-endpoint-scenarios/reports/
