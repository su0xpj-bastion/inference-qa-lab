name: inference-platform-qa
on:
  pull_request:
    paths: ["inference-platform-qa/**", ".github/workflows/inference-platform-qa.yml"]
  push: {branches: [main], paths: ["inference-platform-qa/**", ".github/workflows/inference-platform-qa.yml"]}

defaults:
  run:
    working-directory: inference-platform-qa
concurrency:
  group: inference-platform-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testbed:
    name: unit + integration (local testbed)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: inference-platform-qa/requirements-dev.txt}
      - uses: actions/setup-go@v7
        with: {go-version: "1.22", cache-dependency-path: inference-platform-qa/tools/lbprobe/go.mod}
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/python -m pytest --junitxml=reports/junit.xml
      - run: cd tools/lbprobe && go vet ./... && go test ./...
      - run: scripts/smoke.sh
      - name: latency attribution demo (baseline → 350ms regression → fix)
        run: .venv/bin/python scripts/latency_demo.py
      - if: always()
        run: cat reports/latency.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: testbed-reports, path: inference-platform-qa/reports/}

  kind:
    name: cluster (kind + ingress-nginx)
    needs: testbed
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: actions/setup-go@v7
        with: {go-version: "1.22", cache-dependency-path: inference-platform-qa/tools/lbprobe/go.mod}
      - uses: helm/kind-action@v1.15.2
        with: {cluster_name: inference, config: inference-platform-qa/deploy/kind/kind-config.yaml}
      - name: deploy (ingress-nginx + image + overlay)
        run: scripts/kind_deploy.sh inference
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - name: cluster tests
        env: {INGRESS_URL: "http://localhost:8080"}
        run: .venv/bin/python -m pytest -m cluster tests/cluster --junitxml=reports/junit-cluster.xml -p no:cacheprovider -o addopts="" -s
      - name: wait for rollout to settle (old pods drained and gone)
        run: scripts/wait_settled.sh
      - name: spread gate through real ingress
        run: cd tools/lbprobe && go run . -url http://localhost:8080/v1/chat/completions -host inference.local -n 300 -c 20
      - name: diagnostics (always, so passing runs keep the drain timeline too)
        if: always()
        run: scripts/collect_diagnostics.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: cluster-reports, path: inference-platform-qa/reports/}
