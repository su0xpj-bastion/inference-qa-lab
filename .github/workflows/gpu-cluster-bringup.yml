name: gpu-cluster-bringup
on:
  pull_request:
    paths: ["gpu-cluster-bringup/**", ".github/workflows/gpu-cluster-bringup.yml"]
  push: {branches: [main], paths: ["gpu-cluster-bringup/**", ".github/workflows/gpu-cluster-bringup.yml"]}

defaults:
  run:
    working-directory: gpu-cluster-bringup
concurrency:
  group: gpu-cluster-bringup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: parser + gate + e2e tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13", cache: pip, cache-dependency-path: gpu-cluster-bringup/requirements.txt}
      - run: pip install -r requirements.txt
      - run: python -m pytest --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: junit, path: gpu-cluster-bringup/reports/}

  bringup:
    name: sample bring-up (simulated fleet)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13", cache: pip, cache-dependency-path: gpu-cluster-bringup/requirements.txt}
      - run: pip install -r requirements.txt
      - name: healthy fleet must be ACCEPTED (exit 0)
        run: |
          python -m bringup gen-fleet --scenario healthy --out fleet/healthy
          python -m bringup run --fleet fleet/healthy --manifest manifests/golden.json --out reports/healthy
      - name: leaf-switch fleet must be ACCEPTED_DEGRADED (exit 3) with one rack finding
        run: |
          python -m bringup gen-fleet --scenario leaf-down --out fleet/leaf-down
          rc=0; python -m bringup run --fleet fleet/leaf-down --manifest manifests/golden.json --out reports/leaf-down || rc=$?
          test "$rc" -eq 3
          python -c "import json,sys; r=json.load(open('reports/leaf-down/bringup.json')); sys.exit(len(r['rack_findings']) != 1)"
      - name: defect fleet must be ACCEPTED_DEGRADED (exit 3) with every injected node cordoned
        run: |
          python -m bringup gen-fleet --scenario defects --out fleet/defects
          rc=0; python -m bringup run --fleet fleet/defects --manifest manifests/golden.json --out reports/defects || rc=$?
          test "$rc" -eq 3
          python - <<'PY'
          import json
          r = json.load(open("reports/defects/bringup.json"))
          s = json.load(open("fleet/defects/_scenario.json"))
          assert {c["hostname"] for c in r["cordon"]} == set(s["injected"]), "cordon list != injected defects"
          PY
      - name: post report to job summary
        if: always()
        run: cat reports/defects/bringup.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: bringup-reports, path: gpu-cluster-bringup/reports/}

  provisioning:
    name: provisioning lint (terraform, ansible, shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "1.9.8", terraform_wrapper: false}
      - name: terraform fmt + validate (no credentials, no backend)
        working-directory: gpu-cluster-bringup/provision/aws-p5
        run: |
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - run: pip install ansible-core==2.18.6
      - name: ansible syntax check
        run: ansible-playbook --syntax-check -i provision/onprem/inventory.ini provision/onprem/site.yml provision/onprem/acceptance.yml
      - run: shellcheck scripts/collect.sh
